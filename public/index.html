<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>内容管理</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <!-- 登录 -->
    <section class="login" id="login" hidden>
      <div class="login-card">
        <img class="login-logo brand-logo" alt="" />
        <h1 data-text="title">内容管理</h1>
        <p class="muted"><span data-text="collection"></span>的编辑与发布</p>
        <button class="btn primary lg block" id="login-github" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.9 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .5Z"/></svg>
          使用 GitHub 登录
        </button>
        <details class="token-login">
          <summary>使用访问令牌登录</summary>
          <form id="token-form">
            <input name="token" type="password" placeholder="github_pat_…" autocomplete="off" required />
            <button class="btn" type="submit">登录</button>
          </form>
          <p class="hint">在 GitHub → Settings → Developer settings → Fine-grained tokens 生成，仓库权限选 Contents: Read and write。</p>
        </details>
        <p class="error" id="login-error" hidden></p>
      </div>
    </section>

    <!-- 主界面 -->
    <div class="app" id="app" hidden>
      <aside class="sidebar" id="sidebar">
        <div class="side-top">
          <img class="side-logo brand-logo" alt="" />
          <p class="side-collection" data-text="collection"></p>
          <button class="btn primary block" id="new-article" type="button"><span data-icon="plus"></span>新建文章</button>
          <label class="search">
            <span data-icon="search"></span>
            <input id="search" type="search" placeholder="搜索文章" />
          </label>
          <div class="seg" role="tablist" id="filter">
            <button type="button" class="on" data-filter="all">全部 <span id="count-all"></span></button>
            <button type="button" data-filter="live">已发布 <span id="count-live"></span></button>
            <button type="button" data-filter="draft">草稿 <span id="count-draft"></span></button>
          </div>
        </div>
        <ul class="list" id="list"></ul>
        <div class="side-foot">
          <img class="avatar" id="user-avatar" alt="" />
          <span class="user-name" id="user-name"></span>
          <button class="link-btn" id="logout" type="button">退出</button>
        </div>
      </aside>
      <div class="scrim" id="scrim"></div>

      <main class="main">
        <header class="bar">
          <button class="icon-btn only-mobile" id="open-list" type="button" aria-label="文章列表"><span data-icon="menu"></span></button>
          <div class="bar-status">
            <span class="status" id="status"></span>
            <span class="deploy" id="deploy" hidden></span>
          </div>
          <div class="bar-actions">
            <a class="btn ghost" id="view-live" target="_blank" rel="noopener" hidden><span data-icon="external"></span><span class="hide-sm">在网站查看</span></a>
            <button class="btn ghost danger" id="btn-delete" type="button" hidden>删除</button>
            <button class="btn ghost" id="btn-unpublish" type="button" hidden>撤回为草稿</button>
            <button class="btn ghost" id="btn-save" type="button">保存草稿</button>
            <button class="btn primary" id="btn-publish" type="button">发布</button>
          </div>
        </header>

        <div class="empty" id="empty">
          <span class="empty-icon" data-icon="doc"></span>
          <p>从左侧选择一篇文章，或者新建一篇。</p>
        </div>

        <article class="doc" id="doc" hidden>
          <textarea class="title" id="f-title" rows="1" placeholder="标题"></textarea>

          <div class="meta">
            <label class="meta-item">
              <span class="meta-label">日期</span>
              <input type="date" id="f-date" />
            </label>
            <div class="meta-item grow">
              <span class="meta-label">标签</span>
              <div class="tags" id="tags">
                <input id="tag-input" list="tag-options" placeholder="添加标签" />
              </div>
              <datalist id="tag-options"></datalist>
            </div>
          </div>

          <details class="seo" id="seo">
            <summary>搜索摘要 <span class="muted" id="desc-hint"></span></summary>
            <textarea id="f-desc" rows="3" placeholder="显示在搜索结果里的简介（60～110 字）。不填会自动取正文开头。"></textarea>
          </details>

          <div class="toolbar" id="toolbar">
            <button type="button" data-cmd="h2" title="小标题"><span data-icon="h2"></span></button>
            <button type="button" data-cmd="bold" title="加粗（⌘B）"><span data-icon="bold"></span></button>
            <button type="button" data-cmd="italic" title="斜体（⌘I）"><span data-icon="italic"></span></button>
            <span class="sep"></span>
            <button type="button" data-cmd="bulletList" title="列表"><span data-icon="bulletList"></span></button>
            <button type="button" data-cmd="orderedList" title="编号列表"><span data-icon="orderedList"></span></button>
            <button type="button" data-cmd="blockquote" title="引用"><span data-icon="blockquote"></span></button>
            <button type="button" data-cmd="link" title="链接"><span data-icon="link"></span></button>
            <span class="sep"></span>
            <button type="button" data-cmd="image" title="插入图片（可多选，多张会并排）"><span data-icon="image"></span><span class="tb-label">图片</span></button>
            <span class="spacer"></span>
            <button type="button" data-cmd="undo" title="撤销（⌘Z）"><span data-icon="undo"></span></button>
            <button type="button" data-cmd="redo" title="重做（⇧⌘Z）"><span data-icon="redo"></span></button>
          </div>
          <div class="body" id="body"></div>
          <p class="foot-hint">图片可以直接粘贴或拖进来；点一下图片可以裁剪、加说明、并排。</p>
        </article>

        <!-- 选中图片时的工具条 -->
        <div class="img-bar" id="img-bar" hidden>
          <button type="button" data-img="crop"><span data-icon="crop"></span>裁剪/旋转</button>
          <button type="button" data-img="caption"><span data-icon="caption"></span>说明</button>
          <button type="button" data-img="layout"><span data-icon="columns"></span><span class="layout-label">并排</span></button>
          <button type="button" data-img="replace"><span data-icon="replace"></span>替换</button>
          <button type="button" data-img="delete" class="danger"><span data-icon="trash"></span></button>
          <form class="caption-form" id="caption-form" hidden>
            <input id="caption-input" placeholder="图片说明（显示在图片下方）" />
            <button type="submit">确定</button>
          </form>
        </div>
      </main>
    </div>

    <input type="file" id="file-input" accept="image/*" multiple hidden />

    <!-- 裁剪 -->
    <div class="modal" id="crop-modal" hidden>
      <div class="modal-card crop-card">
        <div class="crop-stage"><img alt="" /></div>
        <div class="crop-tools">
          <div class="seg small">
            <button type="button" data-crop="ratio:free" class="on">自由</button>
            <button type="button" data-crop="ratio:1.7777777778">16:9</button>
            <button type="button" data-crop="ratio:1.3333333333">4:3</button>
            <button type="button" data-crop="ratio:1">1:1</button>
          </div>
          <div class="crop-rotate">
            <button type="button" class="icon-btn" data-crop="left" title="向左旋转"><span data-icon="rotateL"></span></button>
            <button type="button" class="icon-btn" data-crop="right" title="向右旋转"><span data-icon="rotateR"></span></button>
            <button type="button" class="link-btn" data-crop="reset">还原</button>
          </div>
          <div class="crop-actions">
            <button type="button" class="btn ghost" data-crop="cancel">取消</button>
            <button type="button" class="btn primary" data-crop="apply">完成</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 冲突 -->
    <div class="modal" id="conflict-modal" hidden>
      <div class="modal-card narrow">
        <h2>这篇文章已被其他人修改</h2>
        <p class="muted" id="conflict-text">在你打开之后，有人保存了新的版本。</p>
        <div class="modal-actions">
          <button type="button" class="btn ghost" data-conflict="cancel">取消</button>
          <button type="button" class="btn ghost" data-conflict="theirs">载入对方的版本</button>
          <button type="button" class="btn primary" data-conflict="mine">用我的版本覆盖</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>
    <div class="busy" id="busy" hidden><span class="spinner"></span><span id="busy-text"></span></div>

    <script src="./app.js"></script>
  </body>
</html>
