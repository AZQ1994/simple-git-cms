name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # The notices file is generated from the bundled packages; a dependency change must update it
      - run: npm run licenses
      - name: THIRD-PARTY-NOTICES.md is up to date
        run: git diff --exit-code THIRD-PARTY-NOTICES.md
