name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # so CI can be re-run from the Actions tab without pushing

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '26'] # the oldest Node still supported, and the newest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # The browser tests drive the built editor, so they go after the build. One Node version is
      # enough: what they exercise is the browser, not Node. Chrome comes with the runner image.
      - name: Browser tests
        if: matrix.node == '26'
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # The notices file is generated from the bundled packages; a dependency change must update it
      - run: npm run licenses
      - name: THIRD-PARTY-NOTICES.md is up to date
        run: git diff --exit-code THIRD-PARTY-NOTICES.md
