name: Bug report
description: Something the editor does wrong, or a file it changes when it should not
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are welcome in English, Chinese or Japanese. A security problem goes through
        [SECURITY.md](https://github.com/AZQ1994/simple-git-cms/blob/main/SECURITY.md) instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: The `VERSION` file next to the installed editor, or the release you built from
      placeholder: 0.5.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: Chrome 141 on macOS
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: markdown
    attributes:
      label: The article, if a file came back changed
      description: The smallest piece of Markdown that shows it — before, and after saving
      render: markdown
  - type: textarea
    id: config
    attributes:
      label: config.json
      description: The parts that matter here. Nothing in it is secret, but leave out anything you would rather not post
      render: json
